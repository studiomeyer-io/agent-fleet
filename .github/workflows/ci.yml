name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default — no CI job needs write access to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 and 20 are both EOL (2025-04 / 2026-03). The floor is the
        # active LTS line. The LangGraph opt-in deps need Node >= 20, satisfied
        # by both entries here.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `--include=optional` pulls in the LangGraph + Postgres-checkpointer deps
      # so `tsc` type-checks the conductor-langgraph path too. Using `npm install`
      # (not `npm ci`) because `npm ci` skips optional deps unreliably across the
      # node-version + npm-version matrix.
      - run: npm install --include=optional --no-audit --no-fund

      - name: Lint + format check (Biome)
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage gate
        run: npm run coverage

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=optional --no-audit --no-fund
      # Fail only on high/critical advisories — Dependabot's grouped PRs handle
      # the routine patch/minor churn.
      - run: npm audit --audit-level=high
