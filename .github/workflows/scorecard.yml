name: scorecard

# OpenSSF Scorecard — automated security-posture assessment. Runs the Scorecard
# suite (Branch-Protection, Code-Review, Dangerous-Workflow, Dependency-Update-
# Tool, License, Maintained, Pinned-Dependencies, SAST, Security-Policy,
# Token-Permissions, Vulnerabilities, …) and uploads results to the GitHub
# Security tab (SARIF) plus the public Scorecard API (so the README badge
# renders).
#
# Score visible at:
#   https://scorecard.dev/viewer/?uri=github.com/studiomeyer-io/agent-fleet

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '18 4 * * 2' # Tuesdays 04:18 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard-analysis
    runs-on: ubuntu-latest
    permissions:
      # SARIF upload to the Security tab
      security-events: write
      # Required for `publish_results: true` (OIDC -> Scorecard API)
      id-token: write
      contents: read
      actions: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: run scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # `publish_results: true` is what makes the README badge work
          # (otherwise it renders a question-mark forever).
          publish_results: true

      - name: upload SARIF to security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard

      - name: upload raw artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
