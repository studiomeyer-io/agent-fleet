name: Release

# On a v* tag: verify, publish @studiomeyer-io/agent-fleet to npm with provenance,
# then cut a GitHub Release. Requires an NPM_TOKEN secret (npm automation token).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install --include=optional --no-audit --no-fund

      # Gate the release on a green tree. `prepublishOnly` re-runs build + test
      # on `npm publish` too, but running it here makes a failure obvious.
      - name: Verify (build, lint, typecheck, test)
        run: |
          npm run build
          npm run check
          npm run typecheck
          npm test

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
