name: Release

# On a v* tag: verify, publish @studiomeyer-io/agent-fleet to npm with provenance,
# then cut a GitHub Release. Requires an NPM_TOKEN secret (npm automation token).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install --include=optional --no-audit --no-fund

      # Gate the release on a green tree. `prepublishOnly` re-runs build + test
      # on `npm publish` too, but running it here makes a failure obvious.
      - name: Verify (build, lint, typecheck, test)
        run: |
          npm run build
          npm run check
          npm run typecheck
          npm test

      # Token-optional + idempotent: skip cleanly if NPM_TOKEN isn't set (e.g.
      # the version was published manually), and treat an already-published
      # version as success so re-tagging never turns the run red.
      - name: Publish to npm (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No NPM_TOKEN secret set — skipping npm publish."
            exit 0
          fi
          if npm publish --provenance --access public 2>&1 | tee /tmp/pub.log; then
            echo "published"
          elif grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT|403 Forbidden" /tmp/pub.log; then
            echo "this version is already on npm — treating as success"
          else
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
